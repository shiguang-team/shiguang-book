server:
  port: 8080

spring:
  application:
    name: shiguang-book
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:shiguang}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

shiguang:
  jwt:
    # 生产环境请换成环境变量，长度必须 >= 32 字节
    secret: ${JWT_SECRET:shiguang-book-alpha-2026-secret-key-please-change-me}
    expire-seconds: 7200
  upload:
    dir: ${UPLOAD_DIR:./upload}
  captcha:
    dev-fixed-code: "123456"

logging:
  level:
    com.shiguang.book: debug
