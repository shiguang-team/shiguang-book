services:
  mysql:
    image: mysql:8.0
    container_name: shiguang-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shiguang
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
      --innodb-buffer-pool-size=128M
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: shiguang-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: shiguang
      MYSQL_USER: root
      MYSQL_PWD: root
      UPLOAD_DIR: /app/upload
      JAVA_OPTS: -Xmx512m
    volumes:
      - upload-data:/app/upload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: shiguang-web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - upload-data:/data/upload:ro

volumes:
  mysql-data:
  upload-data:
